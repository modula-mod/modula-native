# Greenfield N1 fixture edge. Cloudflare terminates public TLS for this
# development-only hostname; the isolated API remains bound to VPS loopback.
server {
    listen 87.106.40.136:80;
    listen [2a02:2479:68:e400::]:80;
    listen 87.106.40.136:443 ssl;
    listen [2a02:2479:68:e400::]:443 ssl;
    server_name native-n1.modula.digital;

    ssl_certificate /home/andrei/conf/web/modula.digital/ssl/modula.digital.pem;
    ssl_certificate_key /home/andrei/conf/web/modula.digital/ssl/modula.digital.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4021;
    }
}
