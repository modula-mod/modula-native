name: Native boundaries

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:boundary
      - run: npm run verify:design
      - run: npm run typecheck
      - run: npm test
